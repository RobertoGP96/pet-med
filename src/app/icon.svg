<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon: el mismo símbolo que src/components/layout/logo.tsx — la huella
    `PawPrint` de lucide (ISC) en rojo y sin fondo.

    Va como archivo estático y no generado con ImageResponse porque no depende
    de nada: así no cuesta una función en cada petición. El rojo va literal
    (#ec3013, el valor de --brand) porque un favicon se pinta fuera de la
    página, donde no existen las variables CSS del tema. Al no llevar fondo, se
    ve igual sobre una pestaña clara que sobre una oscura.

    El icono de lucide viene en un lienzo de 24 y aquí el cuadrado es de 32, así
    que el grupo se escala y se centra. El grosor sube de 2 a 2.6 porque a 16 px
    —el tamaño real de una pestaña— el trazo original desaparece.
  -->
  <g transform="translate(1.6 1.6) scale(1.2)" fill="none" stroke="#ec3013" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="4" r="2"/>
    <circle cx="18" cy="8" r="2"/>
    <circle cx="20" cy="16" r="2"/>
    <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>
  </g>
</svg>
